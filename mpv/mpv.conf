#使用vulkan后端
gpu-api=vulkan
#通用自动模式硬解
hwdec=auto-safe
#使用默认皮肤
osc=no

# 隐藏按方向键跳转时显示的白色进度条
osd-on-seek=no

# modernz面板汉化需要
--load-stats-overlay=no

#禁用内置快捷键（保留核心需求）
no-input-builtin-bindings

#双击判断时间
input-doubleclick-time=200

# 记住上次播放位置，下次打开继续看
# save-position-on-quit=no

# 运行 MPV 自动窗口最大化 yes代表最大化，no代表正常
# window-maximized=yes

# 默认为系统原生窗口界面，启用此项使用无边框界面（去除 Windows 的窗口装饰）
no-border                             #去除边框及标题栏
# no-title-bar                          #只去除标题栏，保留边框

# 窗口置顶
# ontop                                   


# 字幕默认样式（美观） sub-font(字体)，sub-font-size(字体大小)，sub-color(字幕颜色)，
#sub-border-color(字幕边框颜色)，sub-border-size(字幕边框大小)
#sub-font="Microsoft YaHei"
#sub-font-size=45
#sub-color="#fbc420"
#sub-border-color="#000000"
#sub-border-size=2.5

# 截图保存路径和格式 
# screenshot-directory=~~/desktop/
# screenshot-format=png

watch-later-options-remove=sub-pos
watch-later-options-remove=osd-margin-y