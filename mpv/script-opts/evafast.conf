# 长按时跳过的距离
seek_distance=1

# 播放速度调节因子，每隔 speed_interval 应用一次，直至达到上限
speed_increase=0.1
speed_decrease=0.1

# 应用速度调节因子的时间间隔（秒）
speed_interval=0.01

# 播放速度上限
speed_cap=3

# 显示字幕时的播放速度上限，设为 'no' 则与 speed_cap 相同
subs_speed_cap=1.5

# 在调整之前将当前速度乘以调节因子（指数级加速）
# 需要使用比默认值小得多的数值，例如 speed_increase=0.05, speed_decrease=0.025
multiply_modifier=no

# 在 OSD 上显示当前速度（若使用 uosc，则闪烁显示速度）
show_speed=yes

# 切换速度时在 OSD 上显示当前速度（若使用 uosc，则闪烁显示速度）
show_speed_toggled=yes

# 在 OSD 上显示跳转操作（若使用 uosc，则闪烁时间轴）
show_seek=yes

# 当设置了 subs_speed_cap 时，提前预读以实现更平滑的过渡
lookahead=yes
