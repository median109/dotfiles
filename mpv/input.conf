##可以在mpv.conf中使用选项 --input-conf 指定该文件作为默认加载的快捷键设置文件
##自定义快捷键的规则参见 https://hooke007.github.io/unofficial/mpv_input.html

#MBTN_LEFT cycle pause       #鼠标左键 播放/暂停
ESC set window-minimized yes;set pause yes #esc最小化同时暂停播放
SPACE cycle pause			#空格 暂停/继续

LEFT  seek -1
#RIGHT seek  5
UP  		add volume 2 				#方向键上 音量+2
DOWN  		add volume -2 				#方向键下 音量-2


[ playlist-prev			        #播放列表上一个
] playlist-next			        #播放列表下一个

q quit	 	#关闭mpv播放器	
ALT+q quit-watch-later             # 关闭MPV程序 稍后观看（保存当前文件状态）                        
MBTN_RIGHT quit	 	#鼠标右键 关闭mpv播放器	


t cycle ontop                      #置顶开/关


ENTER cycle fullscreen	    #回车 全屏/退出全屏
f cycle fullscreen	    #回车 全屏/退出全屏

# 插件实现鼠标双击全屏单击暂停
MBTN_LEFT       cycle pause                         #event: click
MBTN_LEFT       cycle fullscreen                    #event: double_click


#MBTN_LEFT_DBL ignore
#MBTN_LEFT_DBL cycle fullscreen #鼠标双击 全屏/退出全屏

#MBTN_RIGHT          context-menu # 右键菜单

# ============================字幕===========================
c cycle sub-visibility         #隐藏字幕
ALT+DOWN add sub-scale -0.05				#字幕缩小5%
ALT+UP add sub-scale +0.05				#字幕放大5%
ALT+LEFT 	add sub-delay -0.1	#字幕延迟-0.1
ALT+RIGHT  	add sub-delay 0.1	#字幕延迟+0.1
#Alt+UP add sub-pos -1					#字幕上移1
#Alt+DOWN add sub-pos +1					#字幕下移1
r sub-reload; show-text "字幕已重新加载"  # 重新加载字幕
# ============================================================


# ====================播放速度调整=============================
- add speed -0.1					#播放速度-0.1
= add speed 0.1						#播放速度+0.1
BS set speed 1.0						#播放速度设为1
# ===========================================================


F10 show-text ${track-list}  		 #F9显示视频、音频、字幕轨道信息
\ show-text ${playlist}            # 查看播放列表
# F12 script-binding browse-files      #选择文件

#j screenshot subtitles 			    #截图带字幕
#J screenshot video                  #只截视频画面
#l cycle sub							#切换字幕轨
#L cycle audio						#切换音轨


#f frame-back-step					#前一帧l(进帧的同时默认开启播放按钮)
#v frame-step						#后一帧(退帧的同时默认不开启播放按钮)
#UP  	seek -1 exact			#后退1秒（带exact较慢但精确）
#DOWN  	seek  1 exact			#前进1秒
#K cycle-values loop-file inf no 	#切换文件循环
#k cycle-values loop-playlist inf no #切换列表循环
#H playlist-shuffle; show-text "playlist-shuffle" #乱序播放列表
